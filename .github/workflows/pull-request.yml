name: Pull Request Checks
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          yarn install

      - name: Lint Code
        run: |
          yarn lint

      - name: Compile TypeScript
        run: |
          yarn compile
      
      - name: Run tests
        run: |
           yarn test